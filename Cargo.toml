[package]
name = "zero-editor"
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["highlighter", "advanced", "tokio", "canvas"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
cosmic-text = "0.15"
encoding_rs = "0.8"
regex = "1.12"

[build-dependencies]
cc = "1.0"
