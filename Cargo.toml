[package]
name = "zero-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["highlighter", "advanced", "tokio"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
cosmic-text = "0.15"
encoding_rs = "0.8"

[build-dependencies]
cc = "1.0"
